<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Assignment Management</h2>
            <p>Create and manage assignments</p>
        </div>

        <div class="form-card">
            <h3>Add New Assignment</h3>
            <form onsubmit="addAssignment(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Title <span class="required">*</span></label>
                        <input type="text" id="title" name="title" placeholder="Assignment title" required>
                    </div>
                    <div class="form-group">
                        <label for="courseId">Course Code <span class="required">*</span></label>
                        <input type="text" id="courseId" name="courseId" placeholder="e.g., CSE101" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="classId">Class ID <span class="required">*</span></label>
                        <input type="number" id="classId" name="classId" placeholder="Class ID" required>
                    </div>
                    <div class="form-group">
                        <label for="givenOn">Given On <span class="required">*</span></label>
                        <input type="date" id="givenOn" name="givenOn" required>
                    </div>
                    <div class="form-group">
                        <label for="deadline">Deadline <span class="required">*</span></label>
                        <input type="date" id="deadline" name="deadline" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="description">Description <span class="required">*</span></label>
                    <textarea id="description" name="description" rows="4" placeholder="Assignment description" required></textarea>
                </div>
                <button type="submit" class="auth-btn primary">Add Assignment</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Assignments</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">
                Loading assignments...
            </div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>Assignment ID</th>
                        <th>Title</th>
                        <th>Course</th>
                        <th>Class</th>
                        <th>Given On</th>
                        <th>Deadline</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="assignment-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No assignments found. Add an assignment to get started.</p>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/assignments.js"></script>
</body>
</html>
