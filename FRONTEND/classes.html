<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Class Management</h2>
            <p>Manage classes, semesters, and academic periods</p>
        </div>

        <div class="form-card">
            <h3>Add New Class</h3>
            <form onsubmit="addClass(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="sem">Semester <span class="required">*</span></label>
                        <input type="number" id="sem" name="sem" min="1" max="12" required>
                    </div>
                    <div class="form-group">
                        <label for="branch">Branch <span class="required">*</span></label>
                        <input type="text" id="branch" name="branch" placeholder="e.g., Computer Science" required>
                    </div>
                    <div class="form-group">
                        <label for="degree">Degree <span class="required">*</span></label>
                        <input type="text" id="degree" name="degree" placeholder="e.g., B.Tech" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Start Date <span class="required">*</span></label>
                        <input type="date" id="startDate" name="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End Date <span class="required">*</span></label>
                        <input type="date" id="endDate" name="endDate" required>
                    </div>
                </div>
                <button type="submit" class="auth-btn primary">Add Class</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Classes</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">Loading classes...</div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>Class ID</th>
                        <th>Semester</th>
                        <th>Branch</th>
                        <th>Degree</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                    </tr>
                </thead>
                <tbody id="class-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No classes found. Add a class to get started.</p>
            </div>
        </div>
    </div>

    <script src="/js/classes.js"></script>
</body>
</html>
