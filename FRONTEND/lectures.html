<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectures - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Lecture Management</h2>
            <p>Schedule and manage lectures</p>
        </div>

        <div class="form-card">
            <h3>Add New Lecture</h3>
            <form onsubmit="addLecture(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date <span class="required">*</span></label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="time">Time <span class="required">*</span></label>
                        <input type="time" id="time" name="time" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (minutes) <span class="required">*</span></label>
                        <input type="number" id="duration" name="duration" min="1" max="480" placeholder="1-480" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="courseId">Course Code <span class="required">*</span></label>
                        <input type="text" id="courseId" name="courseId" placeholder="e.g., CSE101" required>
                    </div>
                    <div class="form-group">
                        <label for="classId">Class ID <span class="required">*</span></label>
                        <input type="number" id="classId" name="classId" placeholder="Class ID" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="topic">Topic <span class="required">*</span></label>
                        <input type="text" id="topic" name="topic" placeholder="Lecture topic" required>
                    </div>
                    <div class="form-group">
                        <label for="roomNo">Room Number <span class="required">*</span></label>
                        <input type="text" id="roomNo" name="roomNo" placeholder="Room No" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="meetLink">Meeting Link (Optional)</label>
                    <input type="url" id="meetLink" name="meetLink" placeholder="https://meet.google.com/...">
                </div>
                <button type="submit" class="auth-btn primary">Add Lecture</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Lectures</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">
                Loading lectures...
            </div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>Lecture ID</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Topic</th>
                        <th>Course</th>
                        <th>Class</th>
                        <th>Room</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="lecture-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No lectures found. Add a lecture to get started.</p>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/lectures.js"></script>
</body>
</html>
