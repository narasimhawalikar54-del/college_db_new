<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Academic Reports</h2>
            <p>View and manage student academic reports</p>
        </div>

        <div class="form-card">
            <h3>Add/Update Report</h3>
            <form onsubmit="addReport(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentId">Student ID <span class="required">*</span></label>
                        <input type="number" id="studentId" name="studentId" placeholder="Student User ID" required>
                    </div>
                    <div class="form-group">
                        <label for="courseId">Course Code <span class="required">*</span></label>
                        <input type="text" id="courseId" name="courseId" placeholder="e.g., CSE101" required>
                    </div>
                    <div class="form-group">
                        <label for="classId">Class ID <span class="required">*</span></label>
                        <input type="number" id="classId" name="classId" placeholder="Class ID" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="seeMarks">SEE Marks (0-100) <span class="required">*</span></label>
                        <input type="number" id="seeMarks" name="seeMarks" min="0" max="100" placeholder="0-100" required>
                    </div>
                    <div class="form-group">
                        <label for="cieMarks">CIE Marks (0-100) <span class="required">*</span></label>
                        <input type="number" id="cieMarks" name="cieMarks" min="0" max="100" placeholder="0-100" required>
                    </div>
                    <div class="form-group">
                        <label for="grade">Grade <span class="required">*</span></label>
                        <input type="text" id="grade" name="grade" placeholder="e.g., A, B, C" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="remark">Remark</label>
                    <textarea id="remark" name="remark" rows="3" placeholder="Optional remarks"></textarea>
                </div>
                <button type="submit" class="auth-btn primary">Save Report</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Reports</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">
                Loading reports...
            </div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Class</th>
                        <th>SEE Marks</th>
                        <th>CIE Marks</th>
                        <th>Grade</th>
                        <th>Remark</th>
                    </tr>
                </thead>
                <tbody id="report-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No reports found.</p>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/reports.js"></script>
</body>
</html>
