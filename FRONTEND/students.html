<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Student Management</h2>
            <p>View and manage student records</p>
        </div>

        <div class="form-card">
            <h3>Add New Student</h3>
            <form onsubmit="addStudent(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="userId">User ID <span class="required">*</span></label>
                        <input type="number" id="userId" name="userId" placeholder="User ID" required>
                    </div>
                    <div class="form-group">
                        <label for="currentClassId">Class ID</label>
                        <input type="number" id="currentClassId" name="currentClassId" placeholder="Optional">
                    </div>
                </div>
                <button type="submit" class="auth-btn primary">Add Student</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Students</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">
                Loading students...
            </div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>DOB</th>
                        <th>Class</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No students found.</p>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/students.js"></script>
</body>
</html>
