<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Attendance Management</h2>
            <p>Record and view student attendance</p>
        </div>

        <div class="form-card">
            <h3>Record Attendance</h3>
            <form onsubmit="addAttendance(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="studentId">Student ID <span class="required">*</span></label>
                        <input type="number" id="studentId" name="studentId" placeholder="Student User ID" required>
                    </div>
                    <div class="form-group">
                        <label for="lectureId">Lecture ID <span class="required">*</span></label>
                        <input type="number" id="lectureId" name="lectureId" placeholder="Lecture ID" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status <span class="required">*</span></label>
                        <select id="status" name="status" required>
                            <option value="">Select Status</option>
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Partial">Partial</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="auth-btn primary">Record Attendance</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Attendance Records</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">
                Loading attendance records...
            </div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Email</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Course</th>
                        <th>Topic</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="attendance-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No attendance records found.</p>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/attendance.js"></script>
</body>
</html>
