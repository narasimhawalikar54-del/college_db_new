<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student - Course View</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h2>Student - Course View</h2>
        <p><a href="/welcome.html">← Back to Home</a></p>
        <table style="width:100%;margin-top:20px;border-collapse:collapse;">
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Branch</th>
                    <th>Course Code</th>
                    <th>Course Name</th>
                </tr>
            </thead>
            <tbody id="view-body"></tbody>
        </table>
    </div>

    <script>
        async function loadView() {
            try {
                const res = await fetch('/api/courses/view');
                if (!res.ok) {
                    const err = await res.json().catch(()=>({}));
                    throw new Error(err.error || res.statusText);
                }
                const rows = await res.json();
                const tbody = document.getElementById('view-body');
                tbody.innerHTML = '';
                rows.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${r.StudentID ?? r.id ?? ''}</td>
                                    <td>${r.StudentName ?? r.Name ?? ''}</td>
                                    <td>${r.Branch ?? r.DeptName ?? ''}</td>
                                    <td>${r.CourseCode ?? ''}</td>
                                    <td>${r.CourseName ?? ''}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('view-body').innerHTML = `<tr><td colspan="5">Error loading view: ${err.message}</td></tr>`;
            }
        }
        window.onload = loadView;
    </script>
</body>
</html>
