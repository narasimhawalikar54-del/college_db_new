<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/courses.js" defer></script>
</head>
<body>
    <div class="container">
        <h2>Add New Course</h2>

        <!-- Branch filter dropdown -->
        <div class="form-group">
            <label for="branch-filter">Filter students by branch</label>
            <select id="branch-filter">
                <option value="">-- Select branch (show courses) --</option>
            </select>
        </div>

        <form id="add-course-form" onsubmit="addCourse(event)">
            <div class="form-group">
                <label>Course Code</label>
                <input type="text" name="courseCode" required>
            </div>
            <div class="form-group">
                <label>Course Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Credits</label>
                <input type="number" name="credits" required>
            </div>
            <div class="form-group">
                <label>Department Name</label>
                <input type="text" name="deptName" required>
            </div>
            <button type="submit" class="auth-btn">Add Course</button>
        </form>

        <h3 id="list-title">All Courses</h3>
        <table id="list-table" style="width:100%;margin-top:20px;border-collapse:collapse;">
            <thead id="list-head">
                <tr>
                    <th>Course Code</th>
                    <th>Name</th>
                    <th>Credits</th>
                    <th>Department Name</th>
                </tr>
            </thead>
            <tbody id="course-table-body"></tbody>
        </table>
    </div>
</body>
</html>
