<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers - College Database System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="nav-bar">
        <h1>CollegeDB</h1>
        <div class="user-info">
            <a href="/dashboard.html" class="nav-link">Dashboard</a>
            <span id="user-name"></span>
            <a href="/auth.html" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="page-header">
            <h2>Teacher Management</h2>
            <p>View and manage teacher records</p>
        </div>

        <div class="form-card">
            <h3>Add New Teacher</h3>
            <form onsubmit="addTeacher(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="userId">User ID <span class="required">*</span></label>
                        <input type="number" id="userId" name="userId" placeholder="User ID" required>
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary <span class="required">*</span></label>
                        <input type="number" id="salary" name="salary" placeholder="Salary" min="0" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ssn">SSN <span class="required">*</span></label>
                        <input type="text" id="ssn" name="ssn" placeholder="Social Security Number" required>
                    </div>
                    <div class="form-group">
                        <label for="department">Department <span class="required">*</span></label>
                        <input type="text" id="department" name="department" placeholder="Department" required>
                    </div>
                </div>
                <button type="submit" class="auth-btn primary">Add Teacher</button>
            </form>
        </div>

        <div class="courses-table-wrapper">
            <h3 style="margin-bottom: 20px; color: #2d3748;">All Teachers</h3>
            <div id="loading-message" style="text-align: center; padding: 40px; color: #718096;">
                Loading teachers...
            </div>
            <table style="display: none;">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody id="teacher-table-body"></tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No teachers found.</p>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/teachers.js"></script>
</body>
</html>
